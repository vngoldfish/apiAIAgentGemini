name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH and Deploy
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # Setup SSH key
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # SSH config for compatibility with RSA keys
          cat > ~/.ssh/config << EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAcceptedAlgorithms +ssh-rsa
            HostkeyAlgorithms +ssh-rsa
          EOF
          chmod 600 ~/.ssh/config
          
          # Test connection
          ssh vps "echo 'SSH connection OK'"
          
          # Deploy
          ssh vps "cd /opt/apps/apiAIAgentGemini && \
            sudo git fetch origin main && \
            sudo git reset --hard origin/main && \
            sudo docker compose build --no-cache && \
            sudo docker compose down && \
            sudo docker compose up -d && \
            sleep 10 && \
            sudo docker ps --filter name=gemini-api && \
            sudo docker logs gemini-api --tail 10"
